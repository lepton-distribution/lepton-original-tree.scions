# OpenOCD — NUCLEO-WL55JC1, sonde STLINK-V3 intégrée (USB direct). Étape 6 : flash (cible CMake
# « flash », flash interne seulement : ni option bytes, ni protection, ni zone sécurisée),
# débogage (gdb, port 3333) du Cortex-M4 (CPU1). L'interface et le numéro de série de la sonde
# sont posés par la cfg générée (cmake/boards/nucleo-wl55jc1.cmake), qui source ce fichier.
transport select hla_swd
source [find target/stm32wlx.cfg]
reset_config srst_only srst_nogate
